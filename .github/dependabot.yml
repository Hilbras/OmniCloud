version: 2
updates:
  # The workspace lockfile lives at the root; pnpm workspaces are handled by
  # Dependabot from the root directory.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: "build(deps)"
    groups:
      # Minor and patch updates for the same package arrive together and are
      # easier to review as one.
      npm-minor:
        update-types:
          - minor
          - patch
      # Anything not already claimed by the group above.
      npm-patch:
        update-types:
          - patch
        exclude-patterns:
          - "*"

  # Actions are pinned to a major version; a new major is worth reading.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels:
      - dependencies
    commit-message:
      prefix: "ci"
