name: Desktop Build & Release

on:
  push:
    tags:
      - "desktop-v*"
      - "v*"
  workflow_dispatch:

jobs:
  build-desktop:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web assets
        run: pnpm --filter @omnicloud/web build

      - name: Bundle server
        run: pnpm --filter @hilbras/omnicloud bundle:server

      - name: Build desktop app (deb + AppImage)
        run: pnpm --filter @hilbras/omnicloud-desktop dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-builds
          path: apps/desktop/dist/*.deb
          retention-days: 30

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-builds-appimage
          path: apps/desktop/dist/*.AppImage
          retention-days: 30

      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cd apps/desktop
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/desktop/dist/*.deb
            apps/desktop/dist/*.AppImage
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
