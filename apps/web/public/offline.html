<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — OmniCloud</title>
    <meta name="theme-color" content="#0b0b0c" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0b0c;
        --surface: #141416;
        --line: #2a2a2e;
        --text: #f5f2ea;
        --muted: #a8a49a;
        --gold: #d9b45b;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at 70% 10%, rgba(217, 180, 91, 0.12), transparent 45%), var(--bg);
        color: var(--text);
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }
      main {
        width: 100%;
        max-width: 420px;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: var(--surface);
        padding: 28px;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
      }
      img {
        width: 40px;
        height: 40px;
      }
      h1 {
        margin: 18px 0 8px;
        font-size: 22px;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0 0 20px;
        color: var(--muted);
        line-height: 1.6;
        font-size: 14px;
      }
      button {
        appearance: none;
        border: 0;
        border-radius: 12px;
        background: var(--gold);
        color: #1b1608;
        font-weight: 600;
        font-size: 14px;
        padding: 11px 18px;
        cursor: pointer;
      }
      button:hover {
        filter: brightness(1.06);
      }
      a {
        color: var(--gold);
      }
      .tiny {
        margin-top: 14px;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" width="40" height="40" />
      <h1>You are offline</h1>
      <p>
        OmniCloud needs a connection for new files. The last saved listing is still available once
        the app loads.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
      <p class="tiny"><a href="/">Go to the home page</a></p>
    </main>
  </body>
</html>
