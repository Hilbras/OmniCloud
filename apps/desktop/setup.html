<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
    />
    <title>OmniCloud setup</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f7f4ee;
        --surface: #fffdf9;
        --text: #2b251d;
        --muted: #7a7064;
        --line: #e4dccf;
        --gold: #b8862f;
        --gold-soft: #f4e7c8;
        --bad: #b3261e;
        --bad-soft: #fde8e6;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #191713;
          --surface: #221f1a;
          --text: #f1e9dd;
          --muted: #b3a899;
          --line: #3a342b;
          --gold: #e0b45f;
          --gold-soft: #342b1c;
          --bad: #ffb4ab;
          --bad-soft: #43201d;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 28px 30px 22px;
        background: var(--bg);
        color: var(--text);
        font:
          14px/1.5 system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }
      h1 {
        margin: 0 0 6px;
        font-size: 22px;
        letter-spacing: -0.02em;
      }
      .lede {
        margin: 0 0 20px;
        color: var(--muted);
      }
      form {
        display: grid;
        gap: 16px;
      }
      label {
        display: grid;
        gap: 6px;
        font-weight: 600;
        font-size: 13px;
      }
      .hint {
        font-weight: 400;
        color: var(--muted);
      }
      input {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--surface);
        color: var(--text);
        font: inherit;
      }
      input:focus {
        outline: 2px solid color-mix(in srgb, var(--gold) 45%, transparent);
        border-color: var(--gold);
      }
      input[aria-invalid="true"] {
        border-color: var(--bad);
      }
      .row {
        display: flex;
        gap: 8px;
      }
      .row input {
        flex: 1;
      }
      button {
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--surface);
        color: var(--text);
        padding: 9px 14px;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover {
        border-color: var(--gold);
      }
      button:disabled {
        opacity: 0.6;
        cursor: default;
      }
      .primary {
        border-color: transparent;
        background: var(--gold);
        color: #fff;
        padding: 11px 18px;
      }
      .link {
        border: 0;
        background: none;
        color: var(--gold);
        padding: 0;
        text-align: left;
        text-decoration: underline;
      }
      .field-error {
        color: var(--bad);
        font-size: 12px;
        font-weight: 500;
      }
      .notice {
        display: none;
        padding: 10px 12px;
        border-radius: 10px;
        background: var(--bad-soft);
        color: var(--bad);
        font-size: 13px;
      }
      .notice.visible {
        display: block;
      }
      .footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-top: 4px;
      }
      .path {
        color: var(--muted);
        font-size: 11px;
        overflow-wrap: anywhere;
      }
      .actions {
        display: flex;
        gap: 10px;
        align-items: center;
      }
    </style>
  </head>
  <body>
    <h1>Set up OmniCloud</h1>
    <p class="lede">
      Everything is configured here and saved locally. You do not need to edit any file.
    </p>

    <form id="setup-form" novalidate>
      <div id="form-error" class="notice" role="alert"></div>

      <label>
        Telegram API ID
        <span class="hint"
          >From <button type="button" id="open-telegram" class="link">my.telegram.org</button> → API
          development tools.</span
        >
        <input id="TELEGRAM_API_ID" name="TELEGRAM_API_ID" inputmode="numeric" autocomplete="off" />
        <span id="error-TELEGRAM_API_ID" class="field-error"></span>
      </label>

      <label>
        Telegram API hash
        <input
          id="TELEGRAM_API_HASH"
          name="TELEGRAM_API_HASH"
          autocomplete="off"
          spellcheck="false"
        />
        <span id="error-TELEGRAM_API_HASH" class="field-error"></span>
      </label>

      <label>
        PostgreSQL URL
        <span class="hint">The database this app will use. It must already be running.</span>
        <input
          id="DATABASE_URL"
          name="DATABASE_URL"
          autocomplete="off"
          spellcheck="false"
          placeholder="postgresql://omnicloud:password@127.0.0.1:5432/omnicloud"
        />
        <span id="error-DATABASE_URL" class="field-error"></span>
      </label>

      <label>
        Encryption key
        <span class="hint">Protects your files. Keep a copy; losing it loses the files.</span>
        <span class="row">
          <input
            id="OMNICLOUD_ENCRYPTION_KEY"
            name="OMNICLOUD_ENCRYPTION_KEY"
            type="password"
            autocomplete="off"
            spellcheck="false"
          />
          <button type="button" id="generate-key">Generate</button>
        </span>
        <span id="error-OMNICLOUD_ENCRYPTION_KEY" class="field-error"></span>
        <span class="hint">
          <label for="reveal-key" style="display: inline-flex; gap: 6px; align-items: center">
            <input id="reveal-key" type="checkbox" style="width: auto" /> Show key
          </label>
        </span>
      </label>

      <div class="footer">
        <span id="config-path" class="path"></span>
        <span class="actions">
          <button type="button" id="cancel">Quit</button>
          <button type="submit" id="save" class="primary">Save and continue</button>
        </span>
      </div>
    </form>

    <script type="module" src="./setup.ts"></script>
  </body>
</html>
